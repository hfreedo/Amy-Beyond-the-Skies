<!doctype html><html lang="es"><meta charset="utf-8"><title>Amy — revisión de rodillas y pies v2</title><style>body{margin:0;background:#e8e1ed;color:#392c42;font:16px system-ui}main{max-width:990px;margin:auto;padding:24px}h1{font-size:23px}p{line-height:1.4}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}article{background:#fff;border:1px solid #bbaec5;border-radius:12px;padding:12px;text-align:center}canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;background:linear-gradient(#bbddf4,#e5d1f1);border-radius:8px}h2{font-size:15px;margin:8px 0}</style><main><h1>Amy — rodillas y pies · revisión v2</h1><p>Ascenso y caída. Revisar la separación entre ambas piernas, la flexión de las rodillas y la forma rígida de cada bota.</p><section class="grid" id="grid"></section><p>Se muestran los fotogramas con ampliación para revisar el dibujo. Hoja completa: 3 columnas × 4 filas, PNG transparente.</p></main><script>const image=new Image();image.src='Assets/Personaje/amy_movimiento_3x4.png';image.onload=()=>{for(let frame=3;frame<9;frame++){const article=document.createElement('article'),canvas=document.createElement('canvas'),title=document.createElement('h2');canvas.width=300;canvas.height=300;title.textContent=(frame<6?'Ascenso ':'Caída ')+(frame%3+1);const ctx=canvas.getContext('2d'),w=image.naturalWidth/3,h=image.naturalHeight/4;ctx.imageSmoothingEnabled=false;ctx.drawImage(image,(frame%3)*w+100,Math.floor(frame/3)*h+120,200,240,25,0,250,300);article.append(canvas,title);document.querySelector('#grid').append(article);}}</script></html>
